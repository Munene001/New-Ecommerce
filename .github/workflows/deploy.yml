name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Load NVM environment cleanly for non-interactive SSH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            export PATH=$PATH:$HOME/.local/share/pnpm:$HOME/.pnpm-global/bin
            
            cd ~/production
            git fetch origin main && git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm build
            
            # Flush old process state to wipe stale Server Action mappings
            pm2 delete pazia-production 2>/dev/null || true
            
            # Start Next.js using proper PM2 argument separation (--)
            pm2 start node_modules/next/dist/bin/next \
              --name "pazia-production" \
              --node-args="--max-old-space-size=2048" \
              --max-memory-restart 2G \
              -- start -p 3000
            
            pm2 save